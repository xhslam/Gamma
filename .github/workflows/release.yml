# 标签触发并行构建；全部产物与远端附件校验后才公开 Release。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: 校验标签、版本和仓库
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun -e 'import { releaseVersion } from "./apps/electron/scripts/release-artifacts"; import pkg from "./apps/electron/package.json"; releaseVersion(process.env.RELEASE_TAG, pkg.version); if (process.env.GITHUB_REPOSITORY !== "xhslam/Gamma") throw new Error("发布仓库不匹配")'
      - name: 发布门禁回归
        run: bun test apps/electron/scripts/release-artifacts.test.ts apps/electron/scripts/release-workflow.test.ts apps/electron/scripts/sign-mac-app.test.ts apps/electron/scripts/install-electron.test.ts apps/electron/scripts/fetch-with-retry.test.ts apps/electron/scripts/prepare-officecli.test.ts
      - run: bun run typecheck
      - name: 校验发布脚本类型
        run: bunx --no-install tsc --noEmit --target ESNext --module Preserve --moduleResolution bundler --types bun --skipLibCheck apps/electron/scripts/release-artifacts.ts apps/electron/scripts/publish-release.ts apps/electron/scripts/release-artifacts.test.ts apps/electron/scripts/release-workflow.test.ts

  build:
    needs: check
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-latest
            platform: mac
            arch: arm64
          - target: mac-x64
            os: macos-15-intel
            platform: mac
            arch: x64
          - target: win-x64
            os: windows-latest
            platform: win
            arch: x64
          - target: linux-x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # 复用项目自定义签名器，明确采用临时签名，不查询正式证书。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ github.ref_name }}
      electron_config_cache: ${{ github.workspace }}/apps/electron/.cache/electron-download
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: 缓存下载与 Rust 构建
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            apps/electron/.cache/agent-desktop
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ env.electron_config_cache }}
            apps/electron/resources/officecli
          key: release-${{ matrix.target }}-${{ hashFiles('bun.lock', 'apps/electron/scripts/prepare-agent-desktop-manifest.ts', 'apps/electron/scripts/prepare-officecli.ts') }}
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: bun install --frozen-lockfile
      - name: 准备 Electron（有限重试）
        run: bun run apps/electron/scripts/install-electron.ts
      - name: 构建 Electron 应用
        run: bun run electron:build
      - name: 准备运行时依赖
        working-directory: apps/electron
        run: |
          bun run sync:runtime-deps
          bun run rebuild:node-pty
      - name: 打包（禁止各平台直接发布）
        working-directory: apps/electron
        run: bunx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: 校验安装包与更新清单
        run: bun run apps/electron/scripts/release-artifacts.ts validate apps/electron/out '${{ matrix.target }}' "$RELEASE_TAG"
      - name: 校验 macOS 临时签名和压缩包
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict 'apps/electron/out/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Gamma.app'
          unzip -t apps/electron/out/*.zip > /dev/null
          hdiutil verify apps/electron/out/*.dmg
      - name: 校验 Windows 安装包归档
        if: runner.os == 'Windows'
        run: 7z t apps/electron/out/*.exe
      - name: 保存已校验产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/electron/out/*.dmg
            apps/electron/out/*.zip
            apps/electron/out/*.exe
            apps/electron/out/*.AppImage
            apps/electron/out/*.deb
            apps/electron/out/*.blockmap
            apps/electron/out/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # 不允许不同版本同时修改 latest Release。
    concurrency:
      group: gamma-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@v4
        with:
          path: release-input
      - name: 重新校验所有平台并合并 macOS 更新清单
        run: bun run apps/electron/scripts/release-artifacts.ts assemble release-input release-output "$RELEASE_TAG"
      - name: 上传草稿、下载复核，最后公开正式 Release
        run: bun run apps/electron/scripts/publish-release.ts release-output "$RELEASE_TAG"
