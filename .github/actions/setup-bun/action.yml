name: 安装固定版本 Bun
description: 为 GitHub 下载服务的临时故障提供有限重试
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      id: first
      continue-on-error: true
      with:
        bun-version: 1.3.14
    - uses: oven-sh/setup-bun@v2
      id: second
      if: steps.first.outcome == 'failure'
      continue-on-error: true
      with:
        bun-version: 1.3.14
    - uses: oven-sh/setup-bun@v2
      if: steps.second.outcome == 'failure'
      with:
        bun-version: 1.3.14
