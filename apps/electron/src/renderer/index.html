<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamma</title>
    <script>
      // 主题初始化脚本（在 React 加载前执行，避免闪烁）
      // 从 localStorage 缓存读取主题模式和特殊风格，立即应用类名
      ;(function() {
        // ESM 缓存迁移尚未执行时，也用旧缓存呈现首帧主题。
        var mode = localStorage.getItem('gamma-theme-mode') ?? localStorage.getItem('proma-theme-mode') ?? 'dark'
        var style = localStorage.getItem('gamma-theme-style') ?? localStorage.getItem('proma-theme-style')
        var scene = localStorage.getItem('gamma-chat-wallpaper') ?? (mode === 'special' ? style : null)
        var html = document.documentElement

        if (['claude-code', 'cloud-drift', 'honu-lagoon', 'koi-pond', 'jellyfish', 'paper-boats', 'fireflies', 'moonlit'].includes(scene)) {
          html.dataset.sceneTheme = scene
          html.classList.toggle('dark', scene !== 'cloud-drift')
        } else if (mode === 'special' && style && style !== 'default') {
          if (style !== 'cloud-drift' && !style.endsWith('-light')) {
            html.classList.add('dark')
          }
        } else if (mode === 'dark' || mode === 'special') {
          html.classList.add('dark')
        } else if (mode === 'system') {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.classList.add('dark')
          }
        }
        // mode === 'light' 时不添加 dark 类
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
