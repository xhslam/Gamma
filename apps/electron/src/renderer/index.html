<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carpus</title>
    <script>
      // 主题初始化脚本（在 React 加载前执行，避免闪烁）
      // 从 localStorage 缓存读取主题模式和特殊风格，立即应用类名
      ;(function() {
        // ESM 缓存迁移尚未执行时，也用旧缓存呈现首帧主题。
        var mode = localStorage.getItem('carpus-theme-mode') ?? localStorage.getItem('proma-theme-mode') ?? 'dark'
        var style = localStorage.getItem('carpus-theme-style') ?? localStorage.getItem('proma-theme-style')
        var scene = localStorage.getItem('carpus-chat-wallpaper') ?? (mode === 'special' ? style : null)
        var html = document.documentElement

        if (['claude-code', 'cloud-drift', 'honu-lagoon', 'koi-pond', 'jellyfish', 'paper-boats', 'fireflies', 'moonlit'].includes(scene)) {
          html.dataset.sceneTheme = scene
          html.classList.toggle('dark', scene !== 'cloud-drift')
        } else if (mode === 'special' && style && style !== 'default') {
          if (style !== 'cloud-drift' && !style.endsWith('-light')) {
            html.classList.add('dark')
          }
        } else if (mode === 'custom') {
          // 首帧先确定明暗语义；完整自定义令牌由 React 主题初始化立即应用。
          try {
            var custom = JSON.parse(localStorage.getItem('carpus-custom-theme') ?? '{}')
            var match = /^#([0-9a-f]{6})$/i.exec(custom.background ?? '')
            if (!match) html.classList.add('dark')
            else {
              var channels = [0, 2, 4].map(function(offset) {
                var value = parseInt(match[1].slice(offset, offset + 2), 16) / 255
                return value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4)
              })
              if (channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722 < 0.35) html.classList.add('dark')
            }
          } catch {
            html.classList.add('dark')
          }
        } else if (mode === 'dark' || mode === 'special') {
          html.classList.add('dark')
        } else if (mode === 'system') {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.classList.add('dark')
          }
        }
        // mode === 'light' 时不添加 dark 类
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
